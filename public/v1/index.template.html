/* ---------- inView ---------- */
function useInView(opts = {}) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { rootMargin: opts.margin || '-40px', threshold: opts.threshold ?? 0.1 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

/* ---------- WordsPullUp ---------- */
function WordsPullUp({ text, className = '', stagger = 0.08, baseDelay = 0, as: Tag = 'h2', showAsterisk = false }) {
  const [ref, inView] = useInView({ margin: '-60px' });
  const words = text.split(' ');
  return (
    <Tag ref={ref} className={className}>
      {words.map((w, i) => {
        const isLast = i === words.length - 1;
        return (
          <span key={i} className="wpu-word-mask">
            <span
              className={'wpu-word ' + (inView ? 'is-in' : '')}
              style={{ transitionDelay: (baseDelay + i * stagger) + 's' }}
            >
              {w}
              {isLast && showAsterisk && (
                <sup className="absolute" style={{ top: '0.18em', right: '-0.32em', fontSize: '0.31em' }}>
                  <span className="star-spin inline-block">✦</span>
                </sup>
              )}
              {!isLast ? '\u00A0' : ''}
            </span>
          </span>
        );
      })}
    </Tag>
  );
}

/* ---------- WordsPullUpMultiStyle ---------- */
function WordsPullUpMultiStyle({ segments, className = '', stagger = 0.07, baseDelay = 0, as: Tag = 'h2' }) {
  const [ref, inView] = useInView({ margin: '-60px' });
  let flat = [];
  segments.forEach((seg, si) => {
    const ws = seg.text.split(' ');
    ws.forEach((w, wi) => flat.push({ word: w, cls: seg.className || '', segLast: wi === ws.length - 1, si }));
  });
  return (
    <Tag ref={ref} className={'flex flex-wrap ' + className}>
      {flat.map((f, i) => (
        <span key={i} className={'wpu-word-mask ' + f.cls}>
          <span className={'wpu-word ' + (inView ? 'is-in' : '')} style={{ transitionDelay: (baseDelay + i * stagger) + 's' }}>
            {f.word}{i < flat.length - 1 ? '\u00A0' : ''}
          </span>
        </span>
      ))}
    </Tag>
  );
}

/* ---------- ScrollLetterReveal ---------- */
function ScrollLetterReveal({ text, className = '' }) {
  const ref = useRef(null);
  const charRefs = useRef([]);
  useEffect(() => {
    const handler = () => {
      if (!ref.current) return;
      const rect = ref.current.getBoundingClientRect();
      const wh = window.innerHeight;
      const start = wh * 0.85;
      const end = wh * 0.2;
      const total = (start - rect.top) / (start - end);
      const p = Math.max(0, Math.min(1, total));
      const chars = charRefs.current.filter(Boolean);
      chars.forEach((el, idx) => {
        const cp = idx / chars.length;
        const local = (p - (cp - 0.05)) / 0.15;
        const op = Math.max(0.18, Math.min(1, 0.18 + local * 0.82));
        el.style.opacity = op;
      });
    };
    handler();
    window.addEventListener('scroll', handler, { passive: true });
    window.addEventListener('resize', handler);
    return () => { window.removeEventListener('scroll', handler); window.removeEventListener('resize', handler); };
  }, []);
  return (
    <p ref={ref} className={className}>
      {text.split('').map((c, i) => (
        <span key={i} ref={(el) => (charRefs.current[i] = el)} className="ar-char" style={{ opacity: 0.2 }}>
          {c}
        </span>
      ))}
    </p>
  );
}

/* ---------- FadeUp ---------- */
function FadeUp({ delay = 0, className = '', children, as: Tag = 'div' }) {
  const [ref, inView] = useInView({ margin: '-40px' });
  return (
    <Tag ref={ref} className={'fade-up ' + (inView ? 'is-in ' : '') + className} style={{ transitionDelay: delay + 's' }}>
      {children}
    </Tag>
  );
}

/* ---------- placeholder visual (patched: shows generated image when available) ---------- */
function slotIdFromLabel(label) {
  return String(label).split('·')[0].trim().toLowerCase().replace(/\s+/g, '-');
}
function CinematicSlot({ label, className = '', tone = 'mid' }) {
  const grad = tone === 'dark'
    ? 'linear-gradient(135deg, #0A100A 0%, #161E16 100%)'
    : tone === 'light'
    ? 'linear-gradient(135deg, #2C3A2D 0%, #1B281C 100%)'
    : 'linear-gradient(135deg, #1A241A 0%, #0E140E 100%)';
  const slotId = slotIdFromLabel(label);
  const imgSrc = '/generated/v1/' + slotId + '.webp';
  const [errored, setErrored] = React.useState(false);
  // If the caller already set a position class, don't prepend 'relative' —
  // Tailwind's source order makes 'relative' win over 'absolute' and kills inset-0 sizing.
  const positioned = /\b(?:absolute|relative|fixed|sticky)\b/.test(className);
  const baseClass = positioned ? 'overflow-hidden ' : 'relative overflow-hidden ';
  return (
    <div className={baseClass + className} style={{ background: grad }}>
      {!errored && (
        <img
          src={imgSrc}
          alt=""
          onError={() => setErrored(true)}
          className="absolute inset-0 w-full h-full object-cover"
        />
      )}
      <div className="absolute inset-0 bg-noise opacity-[0.18] mix-blend-overlay pointer-events-none" />
      {errored && (
        <>
          <div className="absolute inset-0 flex items-end justify-between p-4">
            <span className="font-mono uppercase tracking-[0.16em] text-[9px] text-primary/55">{label}</span>
            <span className="font-mono text-[9px] text-primary/35">▢</span>
          </div>
          <div className="absolute top-3 left-3 right-3 flex items-center justify-between">
            <span className="font-mono text-[9px] text-primary/35">REC •</span>
            <span className="font-mono text-[9px] text-primary/35">01:24</span>
          </div>
        </>
      )}
    </div>
  );
}

function Hero() {
  const [in1, setIn1] = useState(false);

function Reserve() {
  const [submitted, setSubmitted] = useState(false);
  const [sending, setSending] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [startedTracked, setStartedTracked] = useState(false);
  function track(event, props) {
    if (typeof window !== 'undefined' && window.posthog && window.posthog.capture) {
      window.posthog.capture(event, props || {});
    }
  }
  function onFirstFocus() {
    if (startedTracked) return;
    setStartedTracked(true);
    track('reservation_started', { variant: window.__UBIQUE_VARIANT__ });
  }
  async function submit(e) {
    e.preventDefault();
    if (sending || submitted) return;
    setSending(true);
    setErrorMsg('');
    const get = (id) => (document.getElementById(id) || {}).value || '';
    const payload = {
      name: get('f-name'),
      phone: get('f-phone'),
      email: get('f-email'),
      pincode: get('f-pincode'),
      city: get('f-pincode'),
      plan: get('f-plan'),
      variant: window.__UBIQUE_VARIANT__ || 'v1'
    };
    try {
      const res = await fetch('/api/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Server responded ' + res.status);
      setSubmitted(true);
      if (payload.email && window.posthog && window.posthog.identify) {
        window.posthog.identify(payload.email, { name: payload.name, phone: payload.phone, pincode: payload.pincode });
      }
      track('reservation_submitted', { variant: payload.variant, plan: payload.plan, pincode: payload.pincode });
    } catch (err) {
      setErrorMsg('Could not send. Try again or write to hello@ubique.in.');
      track('reservation_failed', { variant: payload.variant, error: String(err && err.message || err) });
    } finally {
      setSending(false);
    }
  }
  return (
    <section id="reserve" className="bg-black py-24 md:py-40 px-4 md:px-8" data-screen-label="06 Reserve">
      <div className="max-w-6xl mx-auto bg-panel rounded-2xl md:rounded-[2rem] px-6 md:px-16 py-20 md:py-28 relative overflow-hidden">
        <div className="absolute inset-0 bg-noise opacity-[0.06] pointer-events-none" />
        <div className="relative">
          <div className="text-center max-w-3xl mx-auto">
            <FadeUp delay={0.05} className="mb-10">
              <CinematicSlot label="IMG-RESERVE · Hand sliding a hanger on a rail" className="rounded-xl aspect-[3/1] w-full max-w-xl mx-auto" tone="mid" />
            </FadeUp>
            <FadeUp><span className="eyebrow">Reserve your spot</span></FadeUp>
            <WordsPullUpMultiStyle
              segments={[
                { text: "Be among", className: "text-primary" },
                { text: "the first", className: "text-primary font-serif italic" },
                { text: "to use Ubique.", className: "text-primary" },
              ]}
              className="mt-5 justify-center text-4xl sm:text-5xl md:text-6xl font-normal display-mid"
            />
            <FadeUp delay={0.25}>
              <p className="mt-6 text-base text-moss leading-[1.55] max-w-xl mx-auto">
                Limited intake. We will reach out when your slot opens up. No payment today, no commitment, no upsell.
              </p>
            </FadeUp>
          </div>

          <FadeUp delay={0.35}>
            <form className="max-w-2xl mx-auto mt-14" onSubmit={submit} onFocus={onFirstFocus}>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                <Field label="Name" id="f-name" placeholder="Enter your name" />
                <Field label="Phone" id="f-phone" type="tel" placeholder="Enter your phone" />
                <Field label="Email" id="f-email" type="email" placeholder="Enter your email" />
                <Field label="Pincode" id="f-pincode" placeholder="Enter your pincode" />
              </div>

              <div className="mt-5 md:mt-6">
                <Field label="Which plan interests you? (Optional)" id="f-plan">
                  <select id="f-plan" defaultValue="" className="field w-full h-12 rounded-lg px-4 text-sm">
                    <option value="" disabled>Select a plan, not binding</option>
                    <option value="a">Plan A · The Wardrobe Plan</option>
                    <option value="b">Plan B · The Stylist Plan</option>
                    <option value="unsure">Not sure yet</option>
                  </select>
                </Field>
              </div>

              <div className="mt-10 flex flex-wrap items-center gap-5">
                <button type="submit" disabled={submitted || sending}
                  className="group inline-flex items-center gap-2 hover:gap-3 transition-all bg-primary rounded-full pl-6 pr-1.5 py-1.5 text-deep disabled:opacity-70">
                  <span className="font-medium text-base">{submitted ? 'Spot reserved' : sending ? 'Sending…' : 'Reserve my spot'}</span>
                  <span className="bg-black rounded-full w-10 h-10 flex items-center justify-center transition-transform duration-300 group-hover:scale-110">
                    {submitted ? <Check size={16} strokeWidth={2.4} className="text-primary" /> : <ArrowRight size={16} className="text-primary" />}
                  </span>
                </button>
                <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-primary/55">Free · We will be in touch when your slot opens up</span>
                {errorMsg ? <span className="text-xs text-red-300">{errorMsg}</span> : null}
              </div>
            </form>
          </FadeUp>
        </div>
      </div>
    </section>
  );
}

      <div className="max-w-7xl mx-auto px-6 md:px-8 py-10 md:py-14 grid grid-cols-12 gap-6 items-end">
        <div className="col-span-12 md:col-span-6">
          <div className="font-medium text-[clamp(56px,9vw,128px)] text-primary leading-[0.85]" style={{ letterSpacing: '-0.06em' }}>
            ubique<span className="star-spin inline-block ml-2 text-[0.35em] align-top">✦</span>
          </div>
          <p className="mt-4 max-w-md text-sm text-moss leading-[1.5]">A wardrobe that knows your body, your closet, and your life.</p>
        </div>
        <div className="col-span-6 md:col-span-3">
          <span className="eyebrow">Contact</span>
          <ul className="mt-4 space-y-2 text-sm text-primary/80">
            <li>hello@ubique.studio</li>
            <li>By appointment</li>
          </ul>
        </div>
        <div className="col-span-6 md:col-span-3">
          <span className="eyebrow">Follow</span>
          <ul className="mt-4 space-y-2 text-sm text-primary/80">
            <li>Instagram</li>
            <li>Substack</li>
            <li>The Field Notes</li>
          </ul>
        </div>
        <div className="col-span-12 mt-8 pt-6 border-t border-primary/10 flex flex-wrap justify-between gap-3 font-mono text-[10px] uppercase tracking-[0.2em] text-primary/45">
          <span>Limited intake · 2026</span>

    <div className="min-h-screen bg-black text-primary">

</script>
